name: baahar

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: baahar
      POSTGRES_USER: baahar
      POSTGRES_PASSWORD: baahar
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baahar -d baahar"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: baahar
      MINIO_ROOT_PASSWORD: ${BAAHAR_OBJECT_SECRET_KEY:-baahar-local-secret}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_PASSWORD: ${BAAHAR_OBJECT_SECRET_KEY:-baahar-local-secret}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 baahar $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/baahar-artifacts;
      mc anonymous set none local/baahar-artifacts;
      "

volumes:
  postgres-data:
  minio-data:
